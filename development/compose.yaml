services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cyber_academy
      MYSQL_USER: cyber_portal
      MYSQL_PASSWORD: cyber_portal
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - cyber_academy_local_mysql:/var/lib/mysql

volumes:
  cyber_academy_local_mysql:
